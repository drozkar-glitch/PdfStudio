workflows:
  kmp-release-workflow:
    name: PdfStudio Android & iOS Release Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Apple API klic
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
    environment:
      android_signing:
        - sudokukey
      vars:
        APP_NAME: "PdfStudio"
        BUNDLE_ID: "cz.mares.pdfstudio"
        PUBLISH_TO_STORES: "false"
        XCODE_PROJECT: "iosApp/iosApp.xcodeproj"
        XCODE_SCHEME: "iosApp"
      java: 17
      xcode: latest
    scripts:
      - name: Generate Gradle Wrapper
        script: |
          if [ ! -f "gradlew" ] || [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew

      - name: Build Android Release AAB and APK
        script: |
          ./gradlew :composeApp:bundleRelease :composeApp:assembleRelease
          BUILD_NUM="${PROJECT_BUILD_NUMBER:-1}"
          VERSION_NAME="1.0.${BUILD_NUM}"
          mv composeApp/build/outputs/apk/release/composeApp-release.apk "composeApp/build/outputs/apk/release/${APP_NAME}-${VERSION_NAME}.apk"
          mv composeApp/build/outputs/bundle/release/composeApp-release.aab "composeApp/build/outputs/bundle/release/${APP_NAME}-${VERSION_NAME}.aab"

      - name: Publish Android AAB to Google Play
        script: |
          if [ "$PUBLISH_TO_STORES" != "true" ]; then
            echo "Publikace do obchodu je vypnuta (PUBLISH_TO_STORES=false). Preskakuji Google Play upload."
          elif [ -f "iosApp/signing/gplaykey.json.b64" ]; then
            echo "Nalezen Google Play klic (gplaykey.json.b64), dekoduji a nahravam do Google Play..."
            base64 --decode -i iosApp/signing/gplaykey.json.b64 -o /tmp/gplay_key.json
            pip3 install --quiet google-api-python-client google-auth-httplib2 google-auth-oauthlib

            python3 - << 'EOF'
          import os
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          from googleapiclient.errors import HttpError

          package_name = os.environ.get("BUNDLE_ID")
          build_num = os.environ.get("PROJECT_BUILD_NUMBER", "1")
          app_name = os.environ.get("APP_NAME")
          aab_path = f"composeApp/build/outputs/bundle/release/{app_name}-1.0.{build_num}.aab"

          try:
              creds = service_account.Credentials.from_service_account_file(
                  "/tmp/gplay_key.json",
                  scopes=["https://www.googleapis.com/auth/androidpublisher"]
              )
              service = build("androidpublisher", "v3", credentials=creds)

              edit_request = service.edits().insert(body={}, packageName=package_name)
              result = edit_request.execute()
              edit_id = result["id"]

              media = MediaFileUpload(aab_path, mimetype="application/octet-stream", resumable=True)
              bundle_response = service.edits().bundles().upload(
                  editId=edit_id,
                  packageName=package_name,
                  media_body=media
              ).execute()
              version_code = bundle_response["versionCode"]
              print(f"AAB uspesne nahrano (versionCode: {version_code}).")

              try:
                  service.edits().tracks().update(
                      editId=edit_id,
                      track="production",
                      packageName=package_name,
                      body={"releases": [{"versionCodes": [str(version_code)], "status": "completed"}]}
                  ).execute()
                  print("Prirazeno do kanalu production (completed).")
              except Exception as track_err:
                  print(f"Upozorneni (pravdepodobne draft aplikace): {track_err}. Ukladam jako draft...")
                  service.edits().tracks().update(
                      editId=edit_id,
                      track="production",
                      packageName=package_name,
                      body={"releases": [{"versionCodes": [str(version_code)], "status": "draft"}]}
                  ).execute()
                  print("Prirazeno do kanalu production jako draft.")

              service.edits().commit(editId=edit_id, packageName=package_name).execute()
              print("Publikace do Google Play uspesne dokoncena!")
          except HttpError as e:
              if e.resp.status == 404:
                  print(f"UPOZORNENI: Balicek '{package_name}' zatim v Google Play Console neexistuje (404 Package not found).")
                  print("Prvni .aab soubor je nutne do Google Play Console nahrat rucne. Preskakuji automaticky upload, aby mohl pokracovat build pro iOS.")
              else:
                  print(f"UPOZORNENI: Chyba Google Play API ({e.resp.status}): {e}. Preskakuji upload, aby mohl pokracovat build pro iOS.")
          except Exception as e:
              print(f"UPOZORNENI: Neocekavana chyba pri nahravani do Google Play: {e}. Preskakuji upload, aby mohl pokracovat build pro iOS.")
          EOF
          else
            echo "Soubor iosApp/signing/gplaykey.json.b64 nebyl nalezen, preskakuji automaticke nahrani do Google Play."
          fi

      - name: Generate Xcode Project, Auto-Register iOS Profile and Build IPA
        script: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"

          ./gradlew :composeApp:linkReleaseFrameworkIosArm64

          if ! command -v xcodegen &> /dev/null; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          fi

          BUILD_NUM="${PROJECT_BUILD_NUMBER:-1}"
          sed -i '' "s/CURRENT_PROJECT_VERSION: .*/CURRENT_PROJECT_VERSION: \"$BUILD_NUM\"/g" iosApp/project.yml

          cd iosApp
          xcodegen generate
          cd ..

          if [ ! -f "iosApp/signing/ioskey.p12.b64" ]; then
            echo "Chybi soubor iosApp/signing/ioskey.p12.b64! Nahraj nejprve certifikat do soukromeho repozitare ios-keys pres StavitelAplikaci.html."
            exit 1
          fi

          base64 --decode -i iosApp/signing/ioskey.p12.b64 -o /tmp/certificate.p12
          CERT_PWD=$(cat iosApp/signing/ioskey.pwd | tr -d '\r\n')

          openssl pkcs12 -in /tmp/certificate.p12 -nocerts -nodes -passin pass:"$CERT_PWD" -out /tmp/cert_key_raw.pem || \
          openssl pkcs12 -legacy -in /tmp/certificate.p12 -nocerts -nodes -passin pass:"$CERT_PWD" -out /tmp/cert_key_raw.pem
          openssl pkey -in /tmp/cert_key_raw.pem -out /tmp/cert_key_raw.pem.clean
          mv /tmp/cert_key_raw.pem.clean /tmp/cert_key_raw.pem
          cp /tmp/cert_key_raw.pem /tmp/cert_key.pem

          keychain initialize

          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/cert_key.pem \
            --create

          keychain add-certificates \
            --certificate /tmp/certificate.p12 \
            --certificate-password "$CERT_PWD"

          xcode-project use-profiles --project "$XCODE_PROJECT"

          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - composeApp/build/outputs/bundle/release/*.aab
      - composeApp/build/outputs/apk/release/*.apk
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
